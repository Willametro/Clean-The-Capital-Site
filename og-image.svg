<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf6"/>
      <stop offset="100%" stop-color="#e6f3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#4ea96b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4ea96b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4ea96b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mark: oversized Capitol cylinder with leaf -->
  <g transform="translate(110,150)">
    <path d="M150 230 Q260 100 220 -40 Q90 30 150 230 Z" fill="#4ea96b"/>
    <path d="M150 230 Q200 150 210 30" stroke="#1f5f3f" stroke-width="4" fill="none" opacity="0.55"/>
    <rect x="42" y="200" width="120" height="120" fill="#1f5f3f"/>
    <rect x="28" y="186" width="148" height="18" fill="#1f5f3f"/>
    <rect x="14" y="316" width="176" height="18" fill="#1f5f3f"/>
    <rect x="56" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="74" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="92" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="110" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="128" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="146" y="220" width="6" height="80" fill="#fafaf6"/>
    <rect x="96" y="148" width="14" height="32" fill="#f5b942"/>
    <circle cx="103" cy="142" r="8" fill="#f5b942"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="'Bricolage Grotesque','Inter',system-ui,sans-serif">
    <text x="440" y="240" font-size="84" font-weight="800" fill="#1a2421" letter-spacing="-2">CLEAN THE</text>
    <text x="440" y="330" font-size="84" font-weight="800" fill="#1f5f3f" letter-spacing="-2">CAPITAL<tspan fill="#4ea96b">.</tspan></text>
    <text x="442" y="395" font-size="28" font-weight="500" fill="#3d4a44">Community trash cleanups in Salem, Oregon.</text>
    <text x="442" y="435" font-size="22" font-weight="500" fill="#6b7670">Bi-weekly Saturdays · 2–5 PM · Free · cleanthecapital.org</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="612" width="400" height="18" fill="#1f5f3f"/>
  <rect x="400" y="612" width="400" height="18" fill="#4ea96b"/>
  <rect x="800" y="612" width="400" height="18" fill="#5db5d4"/>
</svg>
