<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 320" preserveAspectRatio="xMidYEnd meet" aria-hidden="true" role="presentation">
  <!-- Distant skyline layer (very subtle) -->
  <g fill="#1f5f3f" opacity="0.08">
    <rect x="60"   y="240" width="50" height="80"/>
    <rect x="170"  y="220" width="60" height="100"/>
    <rect x="320"  y="235" width="55" height="85"/>
    <rect x="470"  y="225" width="40" height="95"/>
    <rect x="1430" y="240" width="55" height="80"/>
    <rect x="1500" y="220" width="60" height="100"/>
    <rect x="1640" y="240" width="50" height="80"/>
    <rect x="1790" y="255" width="55" height="65"/>
  </g>

  <!-- Foreground silhouette -->
  <g fill="#1f5f3f" opacity="0.18">

    <!-- Left trees -->
    <path d="M0 320 L0 292 Q22 274 44 292 Q60 262 76 288 Q92 272 110 290 L110 320 Z"/>
    <rect x="140" y="240" width="40" height="80"/>
    <rect x="190" y="230" width="50" height="90"/>

    <!-- Downtown blocks approaching the Capitol -->
    <rect x="260" y="215" width="60" height="105"/>
    <rect x="335" y="235" width="50" height="85"/>
    <rect x="400" y="210" width="70" height="110"/>
    <rect x="485" y="225" width="55" height="95"/>
    <rect x="555" y="200" width="65" height="120"/>
    <rect x="635" y="230" width="55" height="90"/>

    <!-- Civic plaza low building -->
    <rect x="700" y="255" width="60" height="65"/>

    <!-- ═══ OREGON STATE CAPITOL — centerpiece ═══ -->
    <!-- Long classical wings (east/west) -->
    <rect x="760" y="240" width="480" height="80"/>
    <!-- Portico level -->
    <rect x="820" y="210" width="360" height="30"/>
  </g>

  <!-- Column lines on portico -->
  <g fill="#fafaf6" opacity="0.55">
    <rect x="830"  y="212" width="2.5" height="28"/>
    <rect x="855"  y="212" width="2.5" height="28"/>
    <rect x="880"  y="212" width="2.5" height="28"/>
    <rect x="905"  y="212" width="2.5" height="28"/>
    <rect x="1095" y="212" width="2.5" height="28"/>
    <rect x="1120" y="212" width="2.5" height="28"/>
    <rect x="1145" y="212" width="2.5" height="28"/>
    <rect x="1170" y="212" width="2.5" height="28"/>
  </g>

  <g fill="#1f5f3f" opacity="0.18">
    <!-- Main central building block -->
    <rect x="860" y="140" width="280" height="70"/>
    <!-- Collar below the drum -->
    <rect x="890" y="132" width="220" height="10"/>
    <!-- Flat-topped fluted drum -->
    <rect x="935" y="70" width="130" height="62"/>
    <!-- Drum cap -->
    <rect x="928" y="62" width="144" height="10"/>
    <!-- Pioneer pedestal -->
    <rect x="989" y="48" width="22" height="14"/>
  </g>

  <!-- Drum vertical fluting -->
  <g fill="#fafaf6" opacity="0.55">
    <rect x="952"  y="74" width="2" height="54"/>
    <rect x="972"  y="74" width="2" height="54"/>
    <rect x="992"  y="74" width="2" height="54"/>
    <rect x="1012" y="74" width="2" height="54"/>
    <rect x="1032" y="74" width="2" height="54"/>
    <rect x="1052" y="74" width="2" height="54"/>
  </g>

  <!-- Oregon Pioneer statue with axe (gold) -->
  <g fill="#f5b942">
    <rect x="996" y="30" width="8" height="18"/>
    <circle cx="1000" cy="26" r="4"/>
    <rect x="993" y="20" width="2.5" height="22"/>
    <rect x="989" y="20" width="10" height="3"/>
  </g>

  <!-- Right of Capitol -->
  <g fill="#1f5f3f" opacity="0.18">
    <rect x="1260" y="240" width="55" height="80"/>
    <rect x="1325" y="210" width="80" height="110"/>
    <rect x="1415" y="235" width="50" height="85"/>

    <!-- Church with steeple -->
    <rect x="1490" y="220" width="55" height="100"/>
    <path d="M1490 220 L1517.5 185 L1545 220 Z"/>
    <rect x="1514" y="158" width="7" height="28"/>
    <path d="M1514 158 L1517.5 140 L1521 158 Z"/>
    <rect x="1516" y="132" width="3" height="9"/>

    <!-- More downtown -->
    <rect x="1565" y="235" width="55" height="85"/>
    <rect x="1625" y="215" width="65" height="105"/>
    <rect x="1700" y="240" width="50" height="80"/>

    <!-- Eco-Earth Globe -->
    <circle cx="1820" cy="282" r="22"/>
    <rect x="1815" y="302" width="10" height="18"/>
  </g>

  <!-- Globe meridian -->
  <g stroke="#fafaf6" stroke-width="1.4" fill="none" opacity="0.6">
    <line x1="1798" y1="282" x2="1842" y2="282"/>
    <ellipse cx="1820" cy="282" rx="10" ry="22"/>
  </g>

  <!-- Right trees -->
  <g fill="#1f5f3f" opacity="0.18">
    <path d="M1860 320 L1860 292 Q1880 274 1900 292 Q1910 264 1920 286 L1920 320 Z"/>
  </g>
</svg>
